<!DOCTYPE html>
<html>
<head>
    <title>Anime Domain Expansion Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body { 
            background: #000; 
            font-family: 'Arial Black', sans-serif;
            color: #fff;
            cursor: none;
        }
        #container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        #canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
        }
        #ui { 
            position: absolute; 
            top: 20px; left: 20px; 
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        #status { font-size: 24px; text-shadow: 0 0 20px #00ff00; }
        .domain-active { filter: brightness(1.5) contrast(1.2); }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div id="status">Ready for Domain Expansion...</div>
            <div>Voice Commands: "Domain Expansion [Name]"</div>
            <div>Hand Gesture: ✋ (Open Palm)</div>
        </div>
        <video id="video" style="display: none;"></video>
    </div>

    <script src="s.js"></script>
</body>
</html>
